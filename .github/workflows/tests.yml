name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # same versions as requirements.lock; torch/ESM are not needed (tests use a cached scan)
      - run: pip install numpy==2.5.3 scipy==1.18.1 pysam==0.24.1 pyyaml==6.0.3 matplotlib==3.8.4 biopython==1.88 pytest==8.3.5
      - run: python -m pytest -q tests
