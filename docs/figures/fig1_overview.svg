   <g id="text_1">
    <text style="font-weight: 600; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="6.372" y="10.755398" transform="rotate(-0 6.372 10.755398)">GENOTYPE (TRACK 1)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 600; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="129.672" y="10.755398" transform="rotate(-0 129.672 10.755398)">MECHANISM</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 600; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="252.972" y="10.755398" transform="rotate(-0 252.972 10.755398)">THERAPEUTIC GOAL</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 600; font-size: 6.4px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="373.806" y="10.755398" transform="rotate(-0 373.806 10.755398)">OUTPUTS</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="12.7836" y="35.736276" transform="rotate(-0 12.7836 35.736276)">p.Leu737*</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(12.7836 51.054697)">stop-gain in exon 17 of 23</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(12.7836 62.436152)">chr15:40209701 T&gt;G</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="12.7836" y="135.540005" transform="rotate(-0 12.7836 135.540005)">p.Asn1002Lys</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(12.7836 150.877519)">missense in the pseudo-</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(12.7836 161.753146)">kinase domain, 10 residues</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(12.7836 173.104695)">from MVA allele L1012P</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(12.7836 183.808103)">chr15:40220612 T&gt;G</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="136.0836" y="36.413261" transform="rotate(-0 136.0836 36.413261)">Null allele</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 51.059338)">stop lies 747 nt upstream</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 61.874121)">of the last exon junction:</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 72.827092)">mRNA decay (NMD),</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 83.401593)">no protein</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="136.0836" y="136.359786" transform="rotate(-0 136.0836 136.359786)">Unstable but functional</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 151.50916)">ESM-2 calibrated on six</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 161.579381)">measured alleles; AlphaFold</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 172.439023)">contacts; AlphaMissense;</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(136.0836 183.181103)">published biology</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(259.3836 35.891214)">Too little BubR1,</text>
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(259.3836 47.157714)">not broken BubR1</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 66.20174)">All of the child's BubR1</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 76.979398)">comes from the unstable</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 87.647228)">allele.</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 96.068995)"/>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 108.651341)">Segregation fails at about</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 120.097249)">6% of normal BubR1 and is</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 130.803751)">near normal at about 13%.</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 139.192003)"/>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 152.444661)">Goal: raise the level of the</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 162.546851)">protein the child already</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(259.3836 173.4694)">makes, about two-fold.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="380.2176" y="36.541604" transform="rotate(-0 380.2176 36.541604)">Candidates</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 51.154213)">niacin, arimoclomol;</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 61.84009)">dasatinib + quercetin</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="380.2176" y="86.450695" transform="rotate(-0 380.2176 86.450695)">Do-no-harm list</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 101.024632)">HSP90, NAMPT, Aurora B</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 112.380821)">and MPS1 inhibitors</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="380.2176" y="136.267864" transform="rotate(-0 380.2176 136.267864)">Cancer-treatment check</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 150.864629)">candidates vs chemotherapy,</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 162.323943)">from FDA label sentences</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 600; font-size: 7.4px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="380.2176" y="186.268877" transform="rotate(-0 380.2176 186.268877)">Resource for families</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 200.807751)">atlas of every BUB1B variant;</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #52514e" transform="translate(380.2176 211.52869)">six related MVA genes</text>
   </g>
  </g>
 </g>
